version: "3.8"

services:
  backend:
    build: ./agent
    container_name: devops-backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      - ./agent/logs:/app/logs
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-1.5-pro}
      - MAX_TOOL_STEPS=${MAX_TOOL_STEPS:-5}
      - MAX_HISTORY=${MAX_HISTORY:-12}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SAFE_WORKSPACE_ROOT=${SAFE_WORKSPACE_ROOT:-/workspace}
      - ALLOWED_SHELL_PREFIXES=${ALLOWED_SHELL_PREFIXES:-ls,dir,pwd,echo,cat,type}
      - TOOL_RATE_LIMIT_COUNT=${TOOL_RATE_LIMIT_COUNT:-60}
      - TOOL_RATE_LIMIT_WINDOW_SECONDS=${TOOL_RATE_LIMIT_WINDOW_SECONDS:-60}
      - TOOL_AUDIT_LOG_PATH=${TOOL_AUDIT_LOG_PATH:-logs/tool_audit.log}
      - DANGEROUS_ACTIONS_REQUIRE_CONFIRMATION=${DANGEROUS_ACTIONS_REQUIRE_CONFIRMATION:-true}
      - DANGEROUS_CONFIRMATION_TOKEN=${DANGEROUS_CONFIRMATION_TOKEN:-CONFIRM}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - GITHUB_MONITOR_REPOS=${GITHUB_MONITOR_REPOS:-}
      - GITHUB_ALERT_CHANNEL=${GITHUB_ALERT_CHANNEL:-}
      - GITHUB_ALERT_POLL_SECONDS=${GITHUB_ALERT_POLL_SECONDS:-120}
      - GITHUB_PR_MONITOR_REPOS=${GITHUB_PR_MONITOR_REPOS:-}
      - GITHUB_PR_ALERT_CHANNEL=${GITHUB_PR_ALERT_CHANNEL:-}
      - GITHUB_PR_POLL_SECONDS=${GITHUB_PR_POLL_SECONDS:-180}
      - GITHUB_DIGEST_REPOS=${GITHUB_DIGEST_REPOS:-}
      - GITHUB_DIGEST_CHANNEL=${GITHUB_DIGEST_CHANNEL:-}
      - GITHUB_DIGEST_HOUR=${GITHUB_DIGEST_HOUR:-9}
      - GITHUB_DIGEST_MINUTE=${GITHUB_DIGEST_MINUTE:-0}
      - GITHUB_TZ_OFFSET_MINUTES=${GITHUB_TZ_OFFSET_MINUTES:-330}
      - JENKINS_URL=${JENKINS_URL:-}
      - JENKINS_USER=${JENKINS_USER:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
      - AZDO_ORG_URL=${AZDO_ORG_URL:-}
      - AZDO_PAT=${AZDO_PAT:-}
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/devops_agent
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-my_secure_encryption_key_32_chars!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-my_jwt_secret_key_change_me_in_prod}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - devops-network

  db:
    image: postgres:16-alpine
    container_name: devops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devops-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devops-redis
    ports:
      - "6379:6379"
    networks:
      - devops-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: devops-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - devops-network

  slack-agent:
    build: ./agent
    container_name: devops-slack-agent
    profiles: ["slack"]
    command: ["python", "slack_bot.py"]
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-1.5-pro}
      - MAX_TOOL_STEPS=${MAX_TOOL_STEPS:-5}
      - MAX_HISTORY=${MAX_HISTORY:-12}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SAFE_WORKSPACE_ROOT=${SAFE_WORKSPACE_ROOT:-/workspace}
      - ALLOWED_SHELL_PREFIXES=${ALLOWED_SHELL_PREFIXES:-ls,dir,pwd,echo,cat,type}
      - TOOL_RATE_LIMIT_COUNT=${TOOL_RATE_LIMIT_COUNT:-60}
      - TOOL_RATE_LIMIT_WINDOW_SECONDS=${TOOL_RATE_LIMIT_WINDOW_SECONDS:-60}
      - TOOL_AUDIT_LOG_PATH=${TOOL_AUDIT_LOG_PATH:-logs/tool_audit.log}
      - DANGEROUS_ACTIONS_REQUIRE_CONFIRMATION=${DANGEROUS_ACTIONS_REQUIRE_CONFIRMATION:-true}
      - DANGEROUS_CONFIRMATION_TOKEN=${DANGEROUS_CONFIRMATION_TOKEN:-CONFIRM}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - GITHUB_MONITOR_REPOS=${GITHUB_MONITOR_REPOS:-}
      - GITHUB_ALERT_CHANNEL=${GITHUB_ALERT_CHANNEL:-}
      - GITHUB_ALERT_POLL_SECONDS=${GITHUB_ALERT_POLL_SECONDS:-120}
      - GITHUB_PR_MONITOR_REPOS=${GITHUB_PR_MONITOR_REPOS:-}
      - GITHUB_PR_ALERT_CHANNEL=${GITHUB_PR_ALERT_CHANNEL:-}
      - GITHUB_PR_POLL_SECONDS=${GITHUB_PR_POLL_SECONDS:-180}
      - GITHUB_DIGEST_REPOS=${GITHUB_DIGEST_REPOS:-}
      - GITHUB_DIGEST_CHANNEL=${GITHUB_DIGEST_CHANNEL:-}
      - GITHUB_DIGEST_HOUR=${GITHUB_DIGEST_HOUR:-9}
      - GITHUB_DIGEST_MINUTE=${GITHUB_DIGEST_MINUTE:-0}
      - GITHUB_TZ_OFFSET_MINUTES=${GITHUB_TZ_OFFSET_MINUTES:-330}
      - JENKINS_URL=${JENKINS_URL:-}
      - JENKINS_USER=${JENKINS_USER:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
      - AZDO_ORG_URL=${AZDO_ORG_URL:-}
      - AZDO_PAT=${AZDO_PAT:-}
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - SLACK_ALLOWED_CHANNEL=${SLACK_ALLOWED_CHANNEL:-}
      - SLACK_REQUIRE_MENTION=${SLACK_REQUIRE_MENTION:-true}
      - MAX_SLACK_REPLY_CHARS=${MAX_SLACK_REPLY_CHARS:-38000}
      - MONITOR_STATE_PATH=${MONITOR_STATE_PATH:-/workspace/monitor_state.json}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/devops_agent
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-my_secure_encryption_key_32_chars!}
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  pgdata:

